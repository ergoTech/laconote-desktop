[package]
name = "laconote-desktop"
version = "0.1.6"
description = "Laconote Desktop - macOS meeting audio capture"
authors = ["Laconote"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "laconote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "laconote-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
keyring = "3"
base64 = "0.22"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", features = ["multipart", "json", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
urlencoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15"
ringbuf = "0.4"
opus = "0.3"
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSResponder"] }
objc2-foundation = "0.2"

[dev-dependencies]
mockito = "1"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

[patch.crates-io]
tao = { git = "https://github.com/Tunglies/tao", branch = "fix/is-zoomed" }


[[bin]]
name = "test_catap"
path = "src/bin/test_catap.rs"

